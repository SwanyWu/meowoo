<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New post · meowoo publisher</title>
    <link rel="stylesheet" href="/static/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <h1>New post</h1>
      <a href="/admin">← Dashboard</a>
    </header>
    <main class="admin-card admin-card--wide">
      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      {% if success %}
      <p class="success">{{ success }}</p>
      {% endif %}
      <form method="post" action="/admin/publish">
        <div class="grid">
          <label>
            Section
            <select name="section">
              {% for s in sections %}
              <option value="{{ s }}" {% if form and form.section == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </label>
          <label>
            Date
            <input type="date" name="post_date" value="{{ form.post_date if form else today }}" required />
          </label>
        </div>
        <label>
          Title
          <input type="text" name="title" value="{{ form.title if form else '' }}" required />
        </label>
        <label>
          Slug (optional)
          <input type="text" name="slug" placeholder="auto-from-title" value="{{ form.slug if form else '' }}" />
        </label>
        <label>
          Excerpt (index card)
          <input type="text" name="excerpt" value="{{ form.excerpt if form else '' }}" required />
        </label>
        <label>
          Meta description (optional)
          <input type="text" name="description" value="{{ form.description if form else '' }}" />
        </label>
        <label>
          Post vibe line (optional, e.g. *sike)
          <input type="text" name="post_vibe" value="{{ form.post_vibe if form else '' }}" />
        </label>
        <label>
          Body (Markdown)
          <textarea name="body" rows="18" required>{{ form.body if form else '' }}</textarea>
        </label>
        <label class="checkbox">
          <input type="checkbox" name="push_github" value="on" {% if github_enabled %}checked{% endif %} />
          Push to GitHub after build
        </label>
        <button type="submit">Publish</button>
      </form>
    </main>
  </body>
</html>
